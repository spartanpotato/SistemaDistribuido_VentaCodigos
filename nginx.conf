events {
    worker_connections 1024; # Number of conections each nginx worker supports
}

http {
    server {
        listen 80;
        server_name localhost; 

        # --- Define where each request go ---

        # Indexación endpoint (POST)
        location /api/indexar {
            proxy_pass http://python_search:5002/api/indexar;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Search API routes
        location /api/buscarPorTitulo {
            proxy_pass http://python_search:5002/api/buscarPorTitulo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Game detail route
        location /api/juego/ {
            proxy_pass http://python_search:5002/api/juego/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cart API routes
        location /api/cart {
            proxy_pass http://python_backend:5050/api/cart;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ventas API routes
        location /api/ventas {
            proxy_pass http://python_backend:5050/api/ventas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Any other route goes to react
        location / {
            proxy_pass http://react_frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
